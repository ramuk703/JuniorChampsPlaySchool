services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: juniorchamps-backend
    read_only: true
    tmpfs:
     - /tmp
    cap_drop:
    - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - juniorchamps-backend-logs:/app/logs
      - juniorchamps-backend-uploads:/app/uploads
    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env.docker

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const req = require('http').get('http://127.0.0.1:5000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0

    networks:
      - juniorchamps-network

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    dns:
      - 8.8.8.8
      - 1.1.1.1

    container_name: juniorchamps-backend-test

    env_file:
      - ./backend/.env.docker

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - juniorchamps-network

    profiles:
      - test

  redis:
    image: redis:7-alpine
    user: "redis"

    container_name: juniorchamps-redis
    read_only: true
    tmpfs:
     - /tmp
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    security_opt:
    - no-new-privileges:true

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --aclfile
      - /data/users.acl
      - --protected-mode
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$REDIS_HEALTH_PASSWORD\" redis-cli --user \"$$REDIS_HEALTH_USERNAME\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    mem_limit: 512m
    cpus: 0.5

    networks:
      - juniorchamps-network

networks:
  juniorchamps-network:
    driver: bridge

volumes:
  redis-data:
  juniorchamps-backend-logs:
  juniorchamps-backend-uploads: