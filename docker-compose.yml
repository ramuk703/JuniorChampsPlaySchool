services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: juniorchamps-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env.docker

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const req = require('http').get('http://127.0.0.1:5000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    networks:
      - juniorchamps-network

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    dns:
      - 8.8.8.8
      - 1.1.1.1

    container_name: juniorchamps-backend-test

    env_file:
      - ./backend/.env.docker

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - juniorchamps-network

    profiles:
      - test

  redis:
    image: redis:7-alpine

    container_name: juniorchamps-redis

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - juniorchamps-network

networks:
  juniorchamps-network:
    driver: bridge

volumes:
  redis-data: